# Fictional demo tenant. Not a real business: names, address and approvals are invented,
# and every phone number is a 555 number.
id: glow_aesthetics
name: Glow Aesthetics
vertical: medspa
timezone: America/New_York
main_number: "+12035550100"      # the published line that forwards to us; never a transfer target
greeting: "Thanks for calling Glow Aesthetics, this is Ava, the spa's virtual assistant. How can I help?"
record_disclosure: "Just so you know, this call is recorded."
ai_identity_reply: "Yes, I'm Glow's virtual assistant. I can help with prices and booking, or get someone from the team for you."
reminder_line: "Are you still there?"
max_turns: 40
max_seconds: 420
retention_days: 30                 # proposed default; attorney to confirm

services:
  - id: tox
    name: Botox
    aliases: [botox, dysport, xeomin, tox, wrinkle relaxer]
    duration_min: 30
    room_type: injectable
    provider_types: [NP, RN]
    price_min: 13
    price_max: 15
    price_unit: "per unit"        # NEVER quote a total for unit-priced items
    notes: "Units are decided by the injector at the appointment."
  - id: filler
    name: Dermal Filler
    aliases: [filler, lip filler, juvederm, restylane]
    duration_min: 45
    room_type: injectable
    provider_types: [NP]
    price_min: 700
    price_max: 950
    price_unit: "per syringe"
    deposit_required: true
    deposit_amount: 100
  - id: weightloss
    name: Weight Loss Program
    aliases: [weight loss, glp, semaglutide, ozempic]
    quotable: false
    consult_required: true

consult:
  name: Consult
  duration_min: 30
  room_type: injectable
  provider_types: [NP, RN]

facts:
  hours: "Monday through Friday 9 to 6, Saturday 10 to 4, closed Sunday."
  address: "1420 Chapel Street, Suite 200, New Haven."
  parking: "Free lot behind the building, enter from Howe Street."
policies:
  cancellation: "24 hours notice, otherwise there's a $50 fee."
  minors: "Patients under 18 need a parent or guardian present."

faq:                               # owner-approved; spoken verbatim; no model paraphrase
  - id: tox_duration
    topics: [botox last, tox last, how long botox, wear off]
    say: "Most clients come back every three to four months, and your injector will go over what to expect at your visit."
    approved_by: "Dr. Jane Doe, NP"
    approved_on: 2026-10-29

  - id: weight_loss_program
    topics: [weight loss program, glp, glp 1, tell me about weight loss]
    say: >-
      Our weight loss program starts with a consultation with one of our
      providers, who goes over your history and goals and decides whether the
      program is a good fit. If it is, you'll have regular check-ins with the
      team along the way.
    approved_by: "SYNTHETIC - demo only"
    approved_on: 2026-11-05

  - id: consultation
    topics: [consultation, consult, first visit]
    say: >-
      A consultation is a one-on-one visit with a provider to talk through your
      goals and options. They'll answer your questions and put together a plan
      with you.
    approved_by: "SYNTHETIC - demo only"
    approved_on: 2026-11-05

  - id: botox_vs_filler
    topics: [difference between botox and filler, botox or filler, botox vs filler]
    say: >-
      Botox is a wrinkle relaxer, and dermal filler adds volume to areas like
      the lips and cheeks. A provider can help you decide which one fits your
      goals at a consultation.
    approved_by: "SYNTHETIC - demo only"
    approved_on: 2026-11-05

  - id: what_to_bring
    topics: [what to bring, what should i bring, check in]
    say: >-
      Please bring a photo ID and arrive a few minutes early to fill out your
      intake forms. The team will go over anything else when they confirm your
      appointment.
    approved_by: "SYNTHETIC - demo only"
    approved_on: 2026-11-05

  - id: providers
    topics: [who does the injections, injector, who are the providers]
    say: >-
      Treatments are done by our licensed providers. You're welcome to ask for a
      specific provider when you book.
    approved_by: "SYNTHETIC - demo only"
    approved_on: 2026-11-05

  - id: payment
    topics: [payment, credit card, how do i pay]
    say: >-
      We accept major credit cards. Some treatments need a deposit when you
      book, and I'll let you know if yours does.
    approved_by: "SYNTHETIC - demo only"
    approved_on: 2026-11-05

  - id: reschedule
    topics: [reschedule, change my appointment, move my appointment]
    say: >-
      You can reschedule by calling us back during business hours, and the team
      will find you a new time. Our cancellation policy still applies to late
      changes.
    approved_by: "SYNTHETIC - demo only"
    approved_on: 2026-11-05

  - id: gift_cards
    topics: [gift card, gift certificate]
    say: >-
      Yes, we offer gift cards. The front desk can set one up for you during
      business hours.
    approved_by: "SYNTHETIC - demo only"
    approved_on: 2026-11-05

transfer_tiers:
  - {tier: 1, kind: transfer, target: "+12035550101", label: front_desk_direct,
     answers_live: true, live_hours: "Mon-Fri 09:00-18:00, Sat 10:00-16:00"}
  - {tier: 2, kind: transfer, target: "+12035550102", label: manager_cell,
     answers_live: false}
  - {tier: 3, kind: sms_summary, target: "+12035550102", label: capture_and_text}

callback_promise: "Someone from the team will call you back at this number within the hour during business hours, or first thing the next business morning."

integration:
