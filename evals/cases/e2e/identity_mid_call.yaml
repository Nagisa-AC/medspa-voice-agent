tenant: glow
clock: "2026-11-03T11:00:00-05:00"
utterances:
  - "how much is lip filler"
  - "are you AI"
  - "what times do you have Thursday"
  - "the first one"
script:
  turns:
    - id: quote
      events:
        - {type: tool_call, id: c1, name: quote_price, args: {service_text: lip filler}}
        - {type: done, stop: tool_calls}
    - id: after_quote
      events:
        - {type: text, text: "Want me to look at times?"}
        - {type: done}
    - id: avail
      events:
        - {type: tool_call, id: c2, name: check_availability, args: {service_text: lip filler}}
        - {type: done, stop: tool_calls}
    - id: after_avail
      events:
        - {type: text, text: "Which of those works?"}
        - {type: done}
    - id: book
      events:
        - type: tool_call
          id: c3
          name: book
          args:
            slot_start_iso: $first_offered
            patient_name: Dana Reyes
            patient_phone: "+12035551234"
            confirmed: true
        - {type: done, stop: tool_calls}
    - id: bye
      events:
        - {type: text, text: "See you then."}
        - {type: done}
expect:
  spoken:
    - contains: "typically runs"
    - contains: "virtual assistant"
    - contains: "I have"
    - contains: "You're all set"
  history:
    - {marker: price, label: "Dermal Filler"}
  events:
    present: [booking_confirmed]
    absent: [sms_logged]
