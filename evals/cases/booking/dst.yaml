tenant: glow
clock: "2026-11-03T11:00:00-05:00"
utterances:
  - "what times do you have for botox"
  - "book November first at one"
script:
  turns:
    - id: avail
      events:
        - {type: tool_call, id: c1, name: check_availability, args: {service_text: botox}}
        - {type: done, stop: tool_calls}
    - id: follow
      events:
        - {type: text, text: "Which of those works?"}
        - {type: done}
    - id: book
      events:
        - type: tool_call
          id: c2
          name: book
          args:
            slot_start_iso: "2026-11-01T01:00:00"
            patient_name: Dana Reyes
            patient_phone: "+12035551234"
            confirmed: true
        - {type: done, stop: tool_calls}
    - id: after
      events:
        - {type: text, text: "Anything else?"}
        - {type: done}
hooks:
  after: 1
  rewrite_offer: dst
expect:
  spoken:
    - contains: "matched more than one opening"
  events:
    present: [booking_attempted]
    absent: [booking_confirmed]
