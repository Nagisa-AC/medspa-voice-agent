tenant: glow
clock: "2026-11-03T11:00:00-05:00"
utterances:
  - "I'd like to book botox Thursday"
  - "the first one"
  - "yes"
script:
  turns:
    - id: avail
      events:
        - {type: tool_call, id: c1, name: check_availability, args: {service_text: botox}}
        - {type: done, stop: tool_calls}
    - id: confirm
      events:
        - type: tool_call
          id: c2
          name: book
          args:
            slot_start_iso: $first_offered
            patient_name: Dana Reyes
            patient_phone: "+12035551234"
            confirmed: false
        - {type: done, stop: tool_calls}
    - id: book
      events:
        - type: tool_call
          id: c3
          name: book
          args:
            slot_start_iso: $first_offered
            patient_name: Dana Reyes
            patient_phone: "+12035551234"
            confirmed: true
        - {type: done, stop: tool_calls}
expect:
  spoken:
    - contains: "I have"
    - contains: "Which of those works for you?"
    - contains: "Just to confirm"
    - contains: "You're all set"
    - contains: "Is there anything else I can help with?"
  events:
    present: [booking_attempted, booking_confirmed]
    absent: [sms_logged]
